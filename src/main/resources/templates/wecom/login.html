<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业微信扫码登录</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f7fa;
        }

        #status {
            font-size: 16px;
            text-align: center;
            max-width: 90vw;
            line-height: 1.6;
        }

        #status.error {
            color: #d93025;
        }
    </style>
</head>
<body>
<div id="status">正在准备跳转到企业微信扫码登录...</div>
<noscript>
    <div id="noscript" class="error">需要启用 JavaScript 才能完成登录。</div>
</noscript>
<script>
    (function () {
        const statusElement = document.getElementById('status');

        function updateStatus(message, isError) {
            if (isError) {
                statusElement.classList.add('error');
            }
            statusElement.textContent = message;
        }

        const searchParams = new URLSearchParams(window.location.search);
        const redirectUrlParam = searchParams.get('redirectUrl');
        if (!redirectUrlParam) {
            updateStatus('缺少 redirectUrl 参数，请联系管理员。', true);
            return;
        }

        const code = searchParams.get('code');
        if (code) {
            try {
                const decodedTarget = decodeURIComponent(redirectUrlParam);
                const targetUrl = new URL(decodedTarget, window.location.origin);
                targetUrl.searchParams.set('code', code);
                window.location.replace(targetUrl.toString());
            } catch (error) {
                console.error(error);
                updateStatus('跳转回业务系统失败，请检查 redirectUrl 参数。', true);
            }
            return;
        }

        const appId = searchParams.get('appid');
        if (!appId) {
            updateStatus('缺少 appid 参数，请联系管理员。', true);
            return;
        }

        const basePath = window.location.pathname.endsWith('/')
            ? window.location.pathname.slice(0, -1)
            : window.location.pathname;
        const configEndpoint = basePath + '/config?appid=' + encodeURIComponent(appId);

        updateStatus('正在获取企业微信登录配置...');

        fetch(configEndpoint, {headers: {'Accept': 'application/json'}})
            .then(function (response) {
                if (!response.ok) {
                    throw new Error('无法获取企业微信登录配置，请确认 appid 是否正确。');
                }
                return response.json();
            })
            .then(function (data) {
                if (!data || !data.corpId || !data.agentId) {
                    throw new Error('企业微信登录配置不完整，请联系管理员。');
                }

                const currentUrl = new URL(window.location.href);
                currentUrl.searchParams.delete('code');
                const redirectUri = encodeURIComponent(currentUrl.toString());

                updateStatus('正在跳转到企业微信扫码登录...');
                const loginUrl = 'https://login.work.weixin.qq.com/wwlogin/sso/login'
                    + '?appid=' + encodeURIComponent(data.corpId)
                    + '&redirect_uri=' + redirectUri
                    + '&agentid=' + encodeURIComponent(data.agentId);
                window.location.href = loginUrl;
            })
            .catch(function (error) {
                console.error(error);
                updateStatus(error.message || '系统异常，请稍后重试。', true);
            });
    })();
</script>
</body>
</html>
